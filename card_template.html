
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

    body { 
            font-family: 'Pretendard', sans-serif; 
            -webkit-font-smoothing: antialiased;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        /* 📸 단일 카드 규격 및 배경 지정 */
        .card {
            width: 1080px;
            height: 1440px;
            position: relative;
            background-image: url('background.png'); /* 배경 1장 통합 */
            background-size: cover;
            background-position: center;
            padding: 180px 80px 100px 80px; 
            display: flex;
            flex-direction: column;
        }

        /* 📅 제목 및 날짜 영역 */
        .header-section {
            margin-bottom: 120px;
        }

        .main-title {
            font-size: 90px;
            font-weight: 500;
            color: #000000;
            letter-spacing: -2px;
            margin-bottom: 12px;
        }

        .date-text {
            font-size: 35px;
            font-weight: 500;
            color: #111111;
            letter-spacing: -1px;
        }

        /* 🍽️ 코너 메뉴 컨테이너 (이 안에서 2~3단 자동 배치) */
.menu-container {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: flex-start;
    gap: 50px;          /* 두 코너 사이 간격 */
    width: 100%;
    margin-top: 70px;
    height: 780px;
}

.corner-column {
    flex: 0 0 380px;    /* 420px → 300px로 축소 (핵심) */
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

        /* 코너 타이틀 */
        .corner-title {
            font-size: 42px; /* ← 48px에서 축소 */
            font-weight: 500;
            color: #000000;
            margin-bottom: 28px; /* ← 40px에서 축소, 본문과의 간격을 좁힘 */
            white-space: nowrap;
        }

        /* 📝 메뉴 내용 영역 */
        .menu-content {
            width: 100%;
            flex: 1;
            font-size: 38px; /* ← 48px에서 축소해 첫 번째 이미지처럼 여러 줄이 들어가도록 */
            font-weight: 500;
            color: #000000;
            line-height: 1.35; /* ← 1.5에서 축소해 줄간격을 더 촘촘하게 */
            word-break: keep-all;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- 📸 단일 캡처 영역 -->
    <div class="card" id="main-card">
        <div class="header-section">
            <h1 class="main-title">오늘의 학식</h1>
            <div class="date-text">{{CURRENT_DATE}}</div>
        </div>

        <div class="menu-container">
            <!-- 파이썬 코드가 이 위치에 2개~3개의 코너를 동적으로 생성해 밀어넣습니다 -->
            {{MENU_CONTAINERS}}
        </div>
    </div>

</body>
</html>
