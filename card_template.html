<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            -webkit-font-smoothing: antialiased;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        /* 📸 단일 카드 규격 및 배경 지정 */
        .card {
            width: 1080px;
            height: 1440px;
            position: relative;
            background-image: url('background.png'); /* 배경 1장 통합 */
            background-size: cover;
            background-position: center;
            padding: 180px 80px 100px 80px; 
            display: flex;
            flex-direction: column;
        }

        /* 📅 제목 및 날짜 영역 */
        .header-section {
            margin-bottom: 120px;
        }

        .main-title {
            font-size: 82px;
            font-weight: 800;
            color: #000000;
            letter-spacing: -2px;
            margin-bottom: 12px;
        }

        .date-text {
            font-size: 46px;
            font-weight: 700;
            color: #111111;
            letter-spacing: -1px;
        }

        /* 🍽️ 코너 메뉴 컨테이너 (이 안에서 2~3단 자동 배치) */
        .menu-container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: flex-start;
            gap: 40px;
            width: 100%;
            height: 850px; 
        }

        /* 📌 개별 코너 칼럼 (파이썬에서 동적 생성됨) */
        .corner-column {
            flex: 1; /* 데이터 개수에 맞춰 자동으로 가로 비율 쪼개기 */
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 코너 타이틀 */
        .corner-title {
            font-size: 48px;
            font-weight: 800;
            color: #000000;
            margin-bottom: 40px;
            white-space: nowrap;
        }

        /* 📝 메뉴 내용 영역 */
        .menu-content {
            width: 100%;
            flex: 1;
            font-size: 48px; /* 10~12글자가 잘 보이도록 고정 사이즈 */
            font-weight: 500; /* Pretendard Medium 두께로 얇게 변경 */
            color: #000000;
            line-height: 1.5;
            word-break: keep-all;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- 📸 단일 캡처 영역 -->
    <div class="card" id="main-card">
        <div class="header-section">
            <h1 class="main-title">오늘의 학식</h1>
            <div class="date-text">{{CURRENT_DATE}}</div>
        </div>

        <div class="menu-container">
            <!-- 파이썬 코드가 이 위치에 2개~3개의 코너를 동적으로 생성해 밀어넣습니다 -->
            {{MENU_CONTAINERS}}
        </div>
    </div>

</body>
</html>
